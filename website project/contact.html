<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Me | Mannat Garg</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Original+Surfer&display=swap"
        rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }



        body {
            min-height: 100vh;

            font-family: "Inter", sans-serif;

            color: #5a4330;

            background: #eee7dc;

            background-image:
                linear-gradient(rgba(238, 231, 220, 0.90),
                    rgba(238, 231, 220, 0.90)),
                url("images/website back.jpg");

            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }




        #navigation {
            width: min(1000px, 90%);
            min-height: 68px;

            margin: 25px auto;

            display: flex;
            align-items: center;
            justify-content: center;

            gap: 8px;

            background: #eee7dc;

            border-radius: 20px;

            box-shadow:
                8px 8px 18px rgba(163, 148, 128, 0.30),
                -8px -8px 18px rgba(255, 255, 255, 0.85);
        }


        #navigation a {
            padding: 11px 18px;

            color: #6b4b32;

            text-decoration: none;

            font-size: 15px;
            font-weight: 500;

            border-radius: 12px;

            transition: all 0.25s ease;
        }


        #navigation a:hover {
            color: #9b673f;

            box-shadow:
                inset 3px 3px 7px rgba(163, 148, 128, 0.23),
                inset -3px -3px 7px rgba(255, 255, 255, 0.75);
        }




        main {
            width: min(900px, 90%);

            margin: 65px auto;
        }




        .heading {
            text-align: center;

            margin-bottom: 35px;
        }


        .heading span {
            display: inline-block;

            margin-bottom: 12px;

            color: #9b673f;

            font-size: 12px;
            font-weight: 600;

            letter-spacing: 2px;

            text-transform: uppercase;
        }


        h1 {
            font-family: "Original Surfer", cursive;

            color: #67452c;

            font-size: clamp(45px, 7vw, 65px);

            font-weight: 400;
        }


        .heading p {
            max-width: 550px;

            margin: 15px auto 0;

            color: #796451;

            font-size: 15px;

            line-height: 1.7;
        }




        .contact-card {
            padding: 45px;

            background: #eee7dc;

            border-radius: 30px;

            box-shadow:
                12px 12px 28px rgba(163, 148, 128, 0.30),
                -12px -12px 28px rgba(255, 255, 255, 0.85);
        }




        form {
            display: flex;

            flex-direction: column;

            gap: 20px;
        }


        .form-group {
            display: flex;

            flex-direction: column;

            gap: 8px;
        }


        label {
            color: #6b4b32;

            font-size: 13px;

            font-weight: 500;
        }


        input,
        textarea {
            width: 100%;

            padding: 15px 17px;

            border: none;
            outline: none;

            border-radius: 14px;

            background: #eee7dc;

            color: #5a4330;

            font-family: "Inter", sans-serif;

            font-size: 14px;

            box-shadow:
                inset 4px 4px 9px rgba(163, 148, 128, 0.25),
                inset -4px -4px 9px rgba(255, 255, 255, 0.80);

            transition: all 0.25s ease;
        }


        input::placeholder,
        textarea::placeholder {
            color: #aa9886;
        }


        input:focus,
        textarea:focus {
            box-shadow:
                inset 2px 2px 6px rgba(163, 148, 128, 0.25),
                inset -2px -2px 6px rgba(255, 255, 255, 0.80),
                0 0 0 2px rgba(182, 125, 78, 0.20);
        }


        textarea {
            min-height: 140px;

            resize: vertical;
        }




        #submit {
            align-self: flex-start;

            margin-top: 5px;

            padding: 13px 28px;

            border: none;

            border-radius: 14px;

            background: #eee7dc;

            color: #704b31;

            font-family: "Inter", sans-serif;

            font-size: 14px;

            font-weight: 600;

            cursor: pointer;

            box-shadow:
                6px 6px 12px rgba(163, 148, 128, 0.30),
                -6px -6px 12px rgba(255, 255, 255, 0.85);

            transition: all 0.25s ease;
        }


        #submit:hover {
            color: #9b673f;

            transform: translateY(-2px);
        }


        #submit:active {
            transform: translateY(1px);

            box-shadow:
                inset 4px 4px 8px rgba(163, 148, 128, 0.25),
                inset -4px -4px 8px rgba(255, 255, 255, 0.80);
        }



        @media (max-width: 768px) {

            #navigation {
                width: 94%;

                padding: 10px;

                flex-wrap: wrap;
            }


            #navigation a {
                padding: 9px 12px;

                font-size: 14px;
            }


            main {
                width: 92%;

                margin: 40px auto;
            }


            .contact-card {
                padding: 30px 22px;

                border-radius: 25px;
            }


            .heading {
                margin-bottom: 28px;
            }


            .heading p {
                font-size: 14px;
            }


            #submit {
                width: 100%;
            }
        }


        @media (max-width: 450px) {

            h1 {
                font-size: 43px;
            }


            .contact-card {
                padding: 25px 18px;
            }


            input,
            textarea {
                padding: 14px;
            }
        }
    </style>
</head>


<body>



    <nav id="navigation">

        <a href="portfolio.html">
            Home
        </a>

        <a href="about.html">
            About Me
        </a>

        <a href="myproject.html">
            My Projects
        </a>

        <a href="contact.html">
            Contact Me
        </a>

    </nav>


    <main>



        <div class="heading">

            <span>
                Get In Touch
            </span>

            <h1>
                Contact Me
            </h1>

            <p>
                Have a question, idea, or just want to say hello?
                Feel free to drop me a message.
            </p>

        </div>



        <section class="contact-card">

            <form>

                <div class="form-group">

                    <label for="name">
                        Name
                    </label>

                    <input type="text" id="name" name="name" placeholder="Enter your name" required>

                </div>


                <div class="form-group">

                    <label for="tele">
                        Mobile
                    </label>

                    <input type="tel" id="tele" name="mobile" placeholder="Enter your mobile number">

                </div>


                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input type="email" id="email" name="email" placeholder="Enter your email" required>

                </div>


                <div class="form-group">

                    <label for="comment">
                        Message
                    </label>

                    <textarea id="comment" name="message" rows="5" placeholder="Write your message here..."></textarea>

                </div>


                <button type="submit" id="submit">
                    Send Message
                </button>

            </form>

        </section>

    </main>

</body>

</html>
